name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Typecheck depends on packages being built (turbo's `dependsOn: ["^build"]`),
      # and a broken build should fail here rather than at release time.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Package suites plus the repo-hygiene guards under tools/ — until now these
      # ran only in the local pre-commit hook, which `--no-verify` and web edits skip.
      - name: Test
        run: pnpm test
