name: Deploy Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Explicitly opt JavaScript actions into Node.js 24 so the runner does not emit
# "forced to run on Node 24" deprecation warnings for actions that still target
# Node 20 (notably the GitHub Pages actions, which have no Node 24 release yet).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    name: Build and Deploy Pages
    # Skip on the Changesets "Version Packages" (release) merge — it only bumps
    # versions/changelogs, so the deployed Storybook/coverage site is unchanged.
    # The preceding feature merge already deployed the latest content.
    # (On pull_request events head_commit is absent, so this evaluates true and
    # the PR still runs the build validation while the deploy steps stay guarded.)
    if: >-
      !contains(github.event.head_commit.message, 'changeset-release') &&
      !contains(github.event.head_commit.message, 'release packages')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Copy Reports to Storybook
        run: node apps/storybook/scripts/copy-reports.js

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Run Tests with Coverage
        run: pnpm test:coverage

      - name: Prepare Pages
        run: |
          mkdir -p pages
          # Copy storybook to root
          cp -r apps/storybook/storybook-static/* pages/
          # Copy coverage to /coverage path
          cp -r coverage pages/coverage

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
